// ============================================================================================
//  Impacts: camera shake + chromatic aberration are driven from the same hit list as the audio.
// ============================================================================================
const HITS = TIMELINE.shots.filter(s => s.hit > 0).map(s => [s.start, s.hit]);   // [time, strength]: camera shake + chromatic aberration at each cut

// ============================================================================================
//  Authored scene sources. Draw from time, keep the opening complete, and design cut handoffs.
// ============================================================================================
{{SYMBOL_JS}}
{{SCENES_JS}}

// ============================================================================================
//  Optional identity and scene labels
// ============================================================================================
function hud(ctx,t,tf,k){

//  linear radiance to the same accumulator as a Canvas2D shot, with the same shutter time, subpixel jitter and shake,
//  plus a lens sample (depth of field) and a light sample (soft shadows) for the scene to use. The post pass applies the
//  rig's exposure, then clips like a Canvas2D shot (designed colors come out exact) or, with shoulder: true, rolls off

const post=async(path,body)=>{const url=new URL(path,location.href);url.searchParams.set('token',Q.get('token')||'');const r=await fetch(url,{method:'POST',body});if(!r.ok)throw new Error('Capture request failed: '+r.status);};
window.addEventListener('error', e => post('/error', String(e.message) + ' @' + e.lineno));
window.addEventListener('unhandledrejection', e => post('/error', String(e.reason && e.reason.stack || e.reason)));
(async () => {
  // Scenes may define async prepare(): load images (await img.decode()), build text masks. It runs once, after fonts, before any frame.
  await Promise.all([document.fonts.load(F(500,14,MONO)),document.fonts.load(F(900,100,SANS))]);await document.fonts.ready; if(typeof prepare==='function')await prepare();
  if(SHOTS.some(s=>s.three))await setupThree();
  await post('/hello',JSON.stringify({width:PW,height:PH,fps:FPS,duration:DUR}));
  if (MODE === 'still') {
    for (const t of (Q.get('ts') || '0').split(',')) { renderFrame(+t); await post('/still?t=' + t, readFrame()); }
    await post('/done');
  } else if (MODE === 'render') {
    if(TIMELINE.sound.synth)await post('/audio', await renderAudio());
    const n = TIMELINE.frames;
    for (let i = 0; i < n; i++) { renderFrame(i / FPS); await post('/frame?i=' + i, readFrame()); }
    await post('/done');
  } else {
    const t0 = performance.now();
    const loop = () => { const t = ((performance.now() - t0) / 1000) % DUR; renderFrame(Math.floor(t * FPS) / FPS, 2); requestAnimationFrame(loop); };
    loop();
  }
})();
